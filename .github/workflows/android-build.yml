# Builds the Hoopster Android app (android/) on GitHub's servers and keeps the APK as a
# downloadable artifact (task 2026-11-09_android_app, REQ-085). Runs when android/ or this
# file changes on main, or by hand (Actions > Android app > Run workflow).
# Needs the four HOOPSTER_* signing secrets; see android/README.md.
name: Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.9.0"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.HOOPSTER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HOOPSTER_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The signing secrets are missing. Run the 'Android signing key' workflow once and add its four values as repository secrets (android/README.md)."
            exit 1
          fi
          # A secret pasted on Windows can carry spaces or line breaks (\r\n); base64 refuses
          # them, so they are removed first. The decoded file must be a readable keystore.
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/hoopster.jks"; then
            # Safe description of what arrived (never the value): length, the code points of
            # characters base64 does not allow, and whether it starts like a PKCS12 file.
            CLEAN="$(printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n')"
            BAD="$(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | od -An -tx1 | tr -s ' \n' ' ' | cut -c1-120)"
            echo "Secret length: raw ${#KEYSTORE_B64}, without spaces/line breaks ${#CLEAN}; length mod 4: $(( ${#CLEAN} % 4 ))"
            echo "Not-allowed characters (hex, first few): ${BAD:-none}"
            case "$CLEAN" in MII*) echo "Starts like a key file: yes" ;; *) echo "Starts like a key file: no" ;; esac
            echo "::error::HOOPSTER_KEYSTORE_B64 is not valid base64. See the three lines above; paste the whole content of HOOPSTER_KEYSTORE_B64.txt again and update the secret."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/hoopster.jks" -storetype PKCS12 \
               -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened: HOOPSTER_KEYSTORE_B64 is incomplete or HOOPSTER_KEYSTORE_PASSWORD does not match it. Paste both secrets again."
            exit 1
          fi
          echo "HOOPSTER_KEYSTORE_FILE=$RUNNER_TEMP/hoopster.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        env:
          HOOPSTER_KEYSTORE_PASSWORD: ${{ secrets.HOOPSTER_KEYSTORE_PASSWORD }}
          HOOPSTER_KEY_ALIAS: ${{ secrets.HOOPSTER_KEY_ALIAS }}
          HOOPSTER_KEY_PASSWORD: ${{ secrets.HOOPSTER_KEY_PASSWORD }}
          HOOPSTER_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/hoopster-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoopster-app-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/hoopster.jks"
